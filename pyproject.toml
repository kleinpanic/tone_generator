[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["backups", "venv"]

[tool.ruff.lint]
# Correctness-focused rules (pyflakes + syntax/statement errors); no style churn
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["^backups/", "^venv/", "^build/"]
